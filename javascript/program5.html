<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function findres(){
            var m1=parseInt(document.getElementById("t1").value);
            var m2=parseInt(document.getElementById("t2").value);
            var m3=parseInt(document.getElementById("t3").value);
            var m4=parseInt(document.getElementById("t4").value);
             var m5=parseInt(document.getElementById("t5").value);
             var tot=m1+m2+m3+m4+m5;
             var per= tot/5.0;
             var res="";
             var gra="";
             if(m1>34 && m2>34 && m3>34 && m4>34 && m5>34 )
             {
             res="pass";
             if(per>90)
             gra="grade 1";
            else if(per>=80)
            gra="grade 2";
            else if(per>=70)
            gra="grade 3";
             else if(per>=60)
            gra="grade 4";
            else
            gra="ff";
         
             
            else{
            res="Fail";
            gra="no grade";

            }
        if(res=="pass"){
            document.getElementById("r1").innerHTML="<font color='green'>total="+tot;
                 document.getElementById("r2").innerHTML="<font color='green'>total="+per;
                     document.getElementById("r3").innerHTML="<font color='green'>total="+res;
                     document.getElementById("r4").innerHTML="<font color='green'>grade="+gra;

        }
        else{
             document.getElementById("r1").innerHTML="<font color='red'>total="+tot;
                 document.getElementById("r2").innerHTML="<font color='red'>total="+per;
                     document.getElementById("r3").innerHTML="<font color='red'>total="+res;
                    document.getElementById("r4").innerHTML="<font color='red'>grade="+gra;

        }
        }
    </script>
    
</head>
<body>
    <input type="text" id="t1" placeholder="Enter Marks 1 :"><br>
        <input type="text" id="t2" placeholder="Enter Marks 2 :"><br>
        <input type="text" id="t3" placeholder="Enter Marks 3 :"><br>
<input type="text" id="t4" placeholder="Enter Marks 4 :"><br>
<input type="text" id="t5" placeholder="Enter Marks 5 :"><br>
<input type="button" value="result" onclick="findres()"><br>
<div id="r1"></div>
<div id="r2"></div>
<div id="r3"></div>
<div id="r4"></div>


</body>
</html>
