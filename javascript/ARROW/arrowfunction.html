<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
      var disc = ()=> {
            var arr=[[12,33,23],[44,55,66],[77,88,99]];
                for(var i=0;i<3;i++){
                    for(var j=0;j<3;j++) { 
                            document.write(" " +arr[i][j]);
                     
                    }
                    document.write("<br>");
                }


        }
    </script>
</head>
<body>
    <h1><center>2D Array </center></h1>
    <br>
    <button onclick="disc()">Nested Array</button>
    
</body>
