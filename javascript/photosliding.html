    <script type="text/javascript">
         var i=1;
        function showimage(){
           
            if(i==1)
            document.getElementById("myimg").src="./images/b1.jpg";
            if(i==2)
            document.getElementById("myimg").src="./images/karthi.jpg";

            document.getElementById("myimg").src="./images/karthika.jpg";
           i++;
            if(i>=4)
            i=1;
setTimeout(showimage,1000);
        }
    </script>
</head>
<body onload="showimage()">
