<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function disc(){
            var n= document.getElementById("t1").value;
                for(let i=1;i<=n;i++){
                    for(let j=1;j<=i;j++) { //for(let j=1;j<=n;j++){
                            document.write(" * ");
                      //  document.write(" "+i+j);
                    }
                    document.write("<br>");
                }


        }
    </script>
</head>
<body>
    <h1><center>Nested Loop </center></h1>
    <br><br>
    <input type="number" id="t1" placeholder="Enter a Number">
    <button onclick="disc()">Nested loop</button>
    
</body>
</html>
