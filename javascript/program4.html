<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Script type="text/javascript">
        function color(){
            document.bgColor=event.target.value;
        }
    </Script>
</head>
<body>
    <h1> change baground color</h1>
    <label>select color:</label> <br>
             <input type="radio" onchange="color()" name="col" value="red">red <br>
             <input type="radio" onchange="color()" name="col" value="green">green <br>
             <input type="radio" onchange="color()" name="col" value="pink">blue <br>
             <input type="radio" onchange="color()" name="col" value="yellow">yellow <br>

</body>
</html>
